name: Build Dhaka Rickshaw APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK & accept licenses
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses & install SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "build-tools;36.0.0" "platforms;android-36" || true
          sdkmanager "platforms;android-36.1" || true

      - name: Restore debug.keystore from debug.keystore.base64
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -noprompt \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run Unit Tests & Build Debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare Release Keystore & Build Release APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$SECRET_STORE_PASSWORD" ] && [ -n "$SECRET_KEY_PASSWORD" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/release-upload.jks"
            export KEYSTORE_PATH="${{ runner.temp }}/release-upload.jks"
            export STORE_PASSWORD="$SECRET_STORE_PASSWORD"
            export KEY_PASSWORD="$SECRET_KEY_PASSWORD"
          else
            keytool -genkeypair -noprompt \
              -keystore "${{ runner.temp }}/ci-upload.jks" \
              -storepass android123 \
              -alias upload \
              -keypass android123 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 365 \
              -dname "CN=DhakaRickshaw,O=GitHubCI,C=BD"
            export KEYSTORE_PATH="${{ runner.temp }}/ci-upload.jks"
            export STORE_PASSWORD="android123"
            export KEY_PASSWORD="android123"
          fi
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dhaka-rickshaw-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dhaka-rickshaw-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
